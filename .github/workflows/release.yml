name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.2.1'
        required: true
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode release keystore (if configured)
        env:
          OPENFY_KEYSTORE_BASE64: ${{ secrets.OPENFY_KEYSTORE_BASE64 }}
          OPENFY_KEYSTORE_PASSWORD: ${{ secrets.OPENFY_KEYSTORE_PASSWORD }}
          OPENFY_KEY_ALIAS: ${{ secrets.OPENFY_KEY_ALIAS }}
          OPENFY_KEY_PASSWORD: ${{ secrets.OPENFY_KEY_PASSWORD }}
        run: |
          if [ -n "$OPENFY_KEYSTORE_BASE64" ] && [ -n "$OPENFY_KEYSTORE_PASSWORD" ] && [ -n "$OPENFY_KEY_ALIAS" ] && [ -n "$OPENFY_KEY_PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/openfy-signing"
            echo "$OPENFY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openfy-signing/openfy-release.jks"
            echo "OPENFY_KEYSTORE_PATH=$RUNNER_TEMP/openfy-signing/openfy-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Release signing secrets not configured; the APK will be signed with a debug key."
          fi

      - name: Build release APK
        env:
          OPENFY_KEYSTORE_PASSWORD: ${{ secrets.OPENFY_KEYSTORE_PASSWORD }}
          OPENFY_KEY_ALIAS: ${{ secrets.OPENFY_KEY_ALIAS }}
          OPENFY_KEY_PASSWORD: ${{ secrets.OPENFY_KEY_PASSWORD }}
        run: ./gradlew clean :app:assembleRelease

      - name: Verify APK signature
        run: $(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          cp app/build/outputs/apk/release/app-release.apk "openfy-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk openfy-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Openfy ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            Openfy 0.2.1: reproducción más rápida y nueva interfaz.

            - Reproducción más rápida: resolución de streams bajo demanda y precarga de la siguiente canción.
            - Rediseño completo de la interfaz.
            - Correcciones de errores y mejoras de rendimiento.
            - APK release firmada y verificada con apksigner en CI.
          files: |
            openfy-v*.apk
            openfy-latest.apk
