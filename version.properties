# Single source of truth for the Openfy app version.
#
# Consumed by:
#   - app/build.gradle.kts  (versionCode / versionName)
#   - .github/workflows/release.yml  (release assets and tag validation)
#   - scripts/generate-release-manifest.mjs  (web/downloads/latest.json)
#
# Rules:
#   - versionCode must increase on every published release.
#   - versionName uses semver without the leading "v" (git tags use "v" + versionName).
versionName=0.2.3
versionCode=10
